name: Bug report
description: Report a reproducible problem in YouTube Content Agent.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence that demonstrates the issue.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or deployment
      description: Commit SHA, branch, or Vercel deployment URL when known.
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Browser, operating system, and relevant non-secret configuration.
